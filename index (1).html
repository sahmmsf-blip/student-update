<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>تحديث بيانات الطلبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#f5f6fb;--surface:#fff;--surface2:#f0f2f9;--ink:#141b34;--mut:#5d6785;--line:#e3e6f1;
  --pri:#4338ca;--pri2:#3730a3;--pri-soft:#eceafd;--ok:#0f9d58;--ok-soft:#e3f6ec;--warn:#d97706;--warn-soft:#fdf1dc;--bad:#d1344a;--bad-soft:#fde8ec;--info-soft:#e8f0fe;
  --shadow:0 1px 2px rgba(20,27,52,.05),0 8px 24px rgba(20,27,52,.07);--r:16px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1122;--surface:#161c33;--surface2:#1d2440;--ink:#eef0fa;--mut:#9ba5c6;--line:#283058;
  --pri:#818cf8;--pri2:#a5b4fc;--pri-soft:#262d57;--ok:#34d399;--ok-soft:#10312a;--warn:#fbbf24;--warn-soft:#3a2d10;--bad:#fb7185;--bad-soft:#3d1824;--info-soft:#1c2850;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;height:62px;max-width:1240px;margin:0 auto;padding:0 16px}
.lg1{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff;padding:2px;flex:none;border:1px solid var(--line)}
.official{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center;margin:22px 0 0;flex-wrap:wrap}
.official img{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:18px;padding:5px;box-shadow:var(--shadow);border:1px solid var(--line)}
.official .tx{line-height:1.7;font-size:.88rem;color:var(--mut)}.official .tx b{display:block;color:var(--ink);font-size:1.05rem}
@media(max-width:600px){.official img{width:68px;height:68px}.official{gap:10px}.official .tx{font-size:.78rem}.official .tx b{font-size:.92rem}}
.ro .inp{background:var(--surface2);color:var(--mut);opacity:.85;cursor:not-allowed;border-style:dashed}
.ro-t{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--mut);margin:0 0 2px}
.ro-t .pill{margin-inline-start:auto}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--pri2);border-radius:12px;padding:12px 14px;font-size:.9rem;margin:14px 0}
.pledge{background:var(--warn-soft);border-radius:12px;padding:14px;margin:12px 0;font-size:.93rem;line-height:1.8}
.brand{font-weight:800;font-size:1.02rem;line-height:1.2}.brand small{display:block;font-weight:500;color:var(--mut);font-size:.76rem}
.sp{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.ghost:hover{background:var(--surface2)}

/* hero */
.hero{background:radial-gradient(1200px 400px at 80% -10%,#7c3aed55,transparent),linear-gradient(135deg,#312e81,#4338ca 55%,#6d28d9);color:#fff;border-radius:24px;padding:34px 24px;margin:22px 0;position:relative;overflow:hidden}
.hero h1{margin:0 0 8px;font-size:1.7rem;font-weight:800}.hero p{margin:0;opacity:.88;max-width:520px}
.hero:after{content:"";position:absolute;inset-inline-start:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:#ffffff14}
.choices{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:600px){.choices{grid-template-columns:1fr}.hero h1{font-size:1.4rem}}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:right;cursor:pointer;box-shadow:var(--shadow);transition:.18s}
.choice:hover{transform:translateY(-3px);border-color:var(--pri)}
.choice .ic{width:50px;height:50px;border-radius:14px;background:var(--pri-soft);display:grid;place-items:center;font-size:1.5rem;margin-bottom:12px}
.choice b{display:block;font-size:1.1rem}.choice span{color:var(--mut);font-size:.9rem}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:1.2rem}.card .sub{color:var(--mut);font-size:.92rem;margin-bottom:14px}
.sec-t{display:flex;align-items:center;gap:8px;font-weight:700;margin:22px 0 4px;color:var(--pri)}
.sec-t i{width:26px;height:26px;border-radius:8px;background:var(--pri-soft);display:grid;place-items:center;font-style:normal;font-size:.9rem}
.field{margin-top:14px}
.field>label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:.15s;min-height:48px}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.inp.bad{border-color:var(--bad)}
.inp[dir=ltr]{text-align:right}
.hint{font-size:.8rem;color:var(--mut);margin-top:4px}.errt{font-size:.8rem;color:var(--bad);margin-top:4px;min-height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:10px;font-size:.92rem;background:var(--surface)}
.chk:hover{border-color:var(--pri)}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--pri);flex:none}
.chk.consent{background:var(--pri-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-weight:700;cursor:pointer;min-height:48px;transition:.15s}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--surface2);color:var(--ink)}.btn.sec:hover{background:var(--line)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}.btn.dng{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem;border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.alert{padding:12px 14px;border-radius:12px;font-size:.92rem;margin:12px 0}
.alert.err{background:var(--bad-soft);color:var(--bad)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--info-soft);color:var(--pri2)}.alert.warn{background:var(--warn-soft);color:var(--warn)}

/* stepper */
.steps{display:flex;align-items:center;margin:18px 0 20px}
.steps .s{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut);font-weight:500}
.steps .s b{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.85rem}
.steps .s.on{color:var(--ink)}.steps .s.on b{background:var(--pri);color:#fff}.steps .s.done b{background:var(--ok);color:#fff}
.steps .ln{flex:1;height:2px;background:var(--line);margin:0 10px}

/* children */
.kid{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-top:10px;background:var(--surface)}
.av{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.kid .nm{font-weight:700}.kid .mt{font-size:.82rem;color:var(--mut)}
.kid .x{margin-inline-start:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.76rem;font-weight:700}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-no{background:var(--surface2);color:var(--mut)}.p-re{background:var(--warn-soft);color:var(--warn)}.p-info{background:var(--info-soft);color:var(--pri2)}

.success{text-align:center;padding:30px 10px}
.success .big{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:2.6rem;margin:0 auto 14px}

/* ===== staff layout ===== */
.shell{display:grid;grid-template-columns:240px 1fr;max-width:1240px;margin:0 auto;min-height:calc(100vh - 62px)}
.side{padding:20px 14px;border-inline-end:1px solid var(--line);position:sticky;top:62px;height:calc(100vh - 62px)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:12px;cursor:pointer;text-align:right;font-weight:500;margin-bottom:4px;color:var(--mut)}
.nav:hover{background:var(--surface2)}.nav.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.nav .e{font-size:1.15rem;width:24px;text-align:center}
.main{padding:22px 20px 90px;min-width:0}
.main h1{margin:0 0 4px;font-size:1.5rem}.main .lead{color:var(--mut);margin-bottom:18px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;inset-inline:0;top:auto;height:auto;z-index:25;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);border-inline-end:0}
  .nav{flex:1;flex-direction:column;gap:2px;font-size:.7rem;padding:7px 2px;margin:0;text-align:center}
  .main{padding:16px 14px 100px}
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--mut);font-size:.84rem}.kpi .v{font-size:1.9rem;font-weight:800;line-height:1.2}.kpi .d{font-size:.78rem;color:var(--mut)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.donut{display:flex;align-items:center;gap:18px}
.donut svg{width:130px;height:130px;flex:none}
.lg div{display:flex;align-items:center;gap:8px;font-size:.9rem;margin:4px 0}.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hb{margin:10px 0}.hb .t{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px}
.hb .tr{height:9px;background:var(--surface2);border-radius:6px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.spark{display:flex;align-items:flex-end;gap:5px;height:110px}
.spark div{flex:1;background:linear-gradient(#8b5cf6,#6366f1);border-radius:5px 5px 0 0;min-height:3px;position:relative}
.spark div span{position:absolute;top:-18px;inset-inline:0;text-align:center;font-size:.7rem;color:var(--mut)}
.axis{display:flex;gap:5px;font-size:.66rem;color:var(--mut);margin-top:4px}.axis span{flex:1;text-align:center}
.bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399)}

.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:12px}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr 1fr}.filters .q{grid-column:1/-1}}
@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}}
.filters .inp{padding:10px 12px;min-height:42px;font-size:.9rem}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:860px}
th{position:sticky;top:0;background:var(--surface2);text-align:right;padding:11px 10px;font-weight:700;white-space:nowrap;z-index:1}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:color-mix(in srgb,var(--pri-soft) 40%,transparent)}
td .s{font-size:.78rem;color:var(--mut)}
.acts{display:flex;gap:5px;flex-wrap:wrap}

.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.modal .card{max-width:620px;width:100%;margin:10px 0}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;z-index:90;font-size:.92rem;box-shadow:var(--shadow)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.sw span:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.2s;box-shadow:0 1px 3px #0004}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:after{inset-inline-start:23px}
.setrow{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 10px}
</style>
</head>
<body>
<div class="top"><div class="in">
  <img class="lg1" src="img/moe.jpg" alt="وزارة التربية والتعليم"><img class="lg1" src="img/school.jpg" alt="مدرسة جميل شاكر الثانوية للبنين">
  <div class="brand"><span id="sch">مدرسة جميل شاكر الثانوية للبنين</span><small id="role">بوابة أولياء الأمور</small></div>
  <div class="sp"></div>
  <button class="ghost hide" id="homeBtn">الرئيسية</button>
  <button class="ghost hide" id="outBtn">تسجيل الخروج</button>
</div></div>
<div id="app"></div>
<div id="toastBox"></div>

<script>
const SB_URL="https://seoevtzbaiuyyfngygrs.supabase.co";
const SB_KEY="sb_publishable_NBPWcKdwQekQSvYMoSfk3g_1h9hPDuL";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toEn=s=>String(s??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).trim();
const digits=(s,n)=>toEn(s).replace(/\D/g,"").slice(0,n);
const isNid=v=>/^\d{10}$/.test(v), isPhone=v=>/^07\d{8}$/.test(v);
const initials=n=>(String(n||"?").trim()[0]||"?");
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

let SET={school_name:"المدرسة",form_open:true,deadline:null,announcement:"",consent_text:""};
let staff=null; try{staff=JSON.parse(sessionStorage.getItem("st")||"null")}catch(e){}

async function rpc(fn,args){
  let r; try{ r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})}); }
  catch(e){ throw new Error("لا يوجد اتصال بالإنترنت"); }
  const j=await r.json().catch(()=>null);
  if(!r.ok){
    if(j&&/unauthorized/.test(j.message||"")){ logout(true); throw new Error("انتهت الجلسة، سجّل الدخول من جديد"); }
    if(j&&/forbidden/.test(j.message||"")) throw new Error("لا تملك صلاحية هذا الإجراء");
    throw new Error("تعذّر إتمام العملية، حاول مرة أخرى");
  }
  return j;
}
const ERR={not_found:"البيانات غير مطابقة. تأكد من الرقم الوطني وتاريخ الميلاد.",locked:"تم تجاوز عدد المحاولات. حاول بعد 15 دقيقة.",already_submitted:"تم تحديث بيانات هذا الطالب مسبقاً.",consent_required:"يجب الموافقة على التعهد للمتابعة.",invalid:"تحقق من الحقول المدخلة.",closed:"باب تحديث البيانات مغلق حالياً.",bad_credentials:"اسم المستخدم أو كلمة المرور غير صحيحة.",weak:"كلمة المرور يجب ألا تقل عن 8 أحرف.",bad_nid:"الرقم الوطني يجب أن يتكون من 10 أرقام."};

function applySettings(){ $("#sch").textContent=SET.school_name||"تحديث بيانات الطلبة"; document.title=(SET.school_name||"")+" — تحديث بيانات الطلبة"; }
function chrome(role,{home=false,out=false}={}){ $("#role").textContent=role; $("#homeBtn").classList.toggle("hide",!home); $("#outBtn").classList.toggle("hide",!out); }
$("#homeBtn").onclick=()=>go();
$("#outBtn").onclick=()=>logout();
function logout(silent){ staff=null; sessionStorage.removeItem("st"); if(!silent) toast("تم تسجيل الخروج"); go(); }

async function go(){
  try{ SET=await rpc("get_public_settings"); }catch(e){}
  applySettings();
  if(staff) return staffApp();
  chrome("بوابة أولياء الأمور");
  const closed=!SET.form_open||(SET.deadline&&SET.deadline<new Date().toISOString().slice(0,10));
  app.innerHTML=`<div class="wrap">
   <div class="official"><img src="img/moe.jpg" alt="شعار وزارة التربية والتعليم"><div class="tx">المملكة الأردنية الهاشمية<b>وزارة التربية والتعليم</b>مديرية التربية والتعليم للواء وادي السير<br><b>مدرسة جميل شاكر الثانوية للبنين</b></div><img src="img/school.jpg" alt="شعار المدرسة"></div>
   <div class="hero"><h1>تحديث بيانات الطلبة</h1><p>يرجى من أولياء الأمور تحديث بيانات التواصل مرة واحدة، وتتم العملية في أقل من دقيقتين.</p></div>
   <div class="notice"><span>🔒</span><span>هذه البيانات تُجمع لأغراض العملية التعليمية والتواصل الرسمي بين المدرسة وولي الأمر فقط، وتُحفظ لدى المدرسة ولا تُستخدم لأي غرض آخر.</span></div>
   ${SET.announcement?`<div class="alert info">📢 ${esc(SET.announcement)}</div>`:""}
   ${closed?`<div class="alert warn">باب تحديث البيانات مغلق حالياً.</div>`:""}
   <div class="choices">
    <button class="choice" id="cp"><div class="ic">👨‍👩‍👧‍👦</div><b>دخول ولي الأمر</b><span>حدّث بيانات ابنك أو أبنائك بإدخال واحد</span></button>
    <button class="choice" id="cs"><div class="ic">🔐</div><b>دخول الإدارة والمرشد</b><span>لوحة المتابعة والإحصائيات والتصدير</span></button>
   </div>
   <footer>مديرية التربية والتعليم للواء وادي السير · ${esc(SET.school_name)}<br>البيانات للاستخدام المدرسي والأغراض التعليمية فقط</footer></div>`;
  $("#cp").onclick=parentStart; $("#cs").onclick=staffLogin;
}

/* =================== ولي الأمر =================== */
let kids=[], draft=null, adding=false;   // kids: {nid,dob,name,birth_place,grade,section,nationality,status,data,closed}
const eligible=()=>kids.filter(k=>k.status!=="submitted");
function parentStart(){ kids=[]; draft=null; adding=false; parentPage(); }
function roField(l,v){ return `<div class="field"><label>${l}</label><input class="inp" value="${esc(v||"—")}" disabled tabindex="-1"></div>`; }
function kidCard(k,i){
  const st=k.status==="submitted"?'<span class="pill p-ok">تم التحديث مسبقاً</span>':k.status==="reopened"?'<span class="pill p-re">أُعيد فتحه للتعديل</span>':'<span class="pill p-info">بيانات الطالب</span>';
  return `<div class="card ro"><div class="ro-t"><div class="av" style="width:36px;height:36px;border-radius:10px">${esc(initials(k.name))}</div>${esc(k.name)}${st}<button class="btn sm sec" data-rm="${i}" title="إزالة الطالب" aria-label="إزالة">✕</button></div>
   <div class="grid2">${roField("الرقم الوطني",k.nid)}${roField("تاريخ الميلاد",k.dob)}${roField("مكان الولادة",k.birth_place)}${roField("الجنسية",k.nationality)}${roField("الصف",k.grade)}${roField("الشعبة",k.section)}</div></div>`;
}
function lookupCard(){
  return `<div class="card"><h2>${kids.length?"إضافة طالب آخر":"أدخل بيانات الطالب"}</h2>
   <div class="sub">${kids.length?"ستبقى البيانات التي أدخلتها كما هي، وسيُضاف الطالب إليها.":"أدخل الرقم الوطني وتاريخ الميلاد لعرض بيانات الطالب."}</div>
   <div class="grid2"><div class="field"><label>الرقم الوطني للطالب</label><input class="inp" id="nid" inputmode="numeric" autocomplete="off" dir="ltr" maxlength="10" placeholder="10 أرقام"><div class="errt" id="e1"></div></div>
   <div class="field"><label>تاريخ ميلاد الطالب</label><input class="inp" id="dob" type="date"><div class="errt" id="e2"></div></div></div>
   <div id="lm"></div><div class="actions"><button class="btn" id="add">${kids.length?"إضافة الطالب":"بحث"}</button>${kids.length?'<button class="btn sec" id="cancelAdd">إلغاء</button>':""}</div></div>`;
}
function parentPage(msg){
  chrome("بوابة أولياء الأمور",{home:true});
  const el=eligible(), closed=kids.some(k=>k.closed), showLookup=!kids.length||adding;
  app.innerHTML=`<div class="wrap" style="padding-top:18px">
   ${closed?'<div class="alert warn">باب تحديث البيانات مغلق حالياً.</div>':""}
   ${kids.map(kidCard).join("")}
   ${showLookup?lookupCard():""}
   ${el.length&&!closed&&!showLookup?`<div class="card"><h2>بيانات التواصل</h2><div class="sub">${el.length>1?`سيتم تطبيق هذه البيانات على ${el.length} طلبة.`:"أدخل البيانات التالية بدقة."}</div>
     <div id="fm">${formBody(draft)}</div><div id="m">${msg?`<div class="alert err">${msg}</div>`:""}</div>
     <div class="actions"><button class="btn" id="sv">💾 حفظ</button><button class="btn sec" id="addk">＋ إضافة طالب آخر</button></div></div>`:""}
   ${!el.length&&kids.length&&!showLookup?`<div class="card"><div class="alert ok">جميع الطلبة المضافين تم تحديث بياناتهم مسبقاً. للتعديل تواصل مع المرشد التربوي.</div><div class="actions"><button class="btn" id="addk">＋ إضافة طالب آخر</button></div></div>`:""}
   </div>`;
  $$("[data-rm]").forEach(b=>b.onclick=()=>{kids.splice(+b.dataset.rm,1);parentPage()});
  if(showLookup){ $("#nid").oninput=e=>{e.target.value=digits(e.target.value,10)}; $("#add").onclick=addKid; $("#dob").onkeydown=$("#nid").onkeydown=e=>{if(e.key==="Enter")addKid()};
    if($("#cancelAdd")) $("#cancelAdd").onclick=()=>{adding=false;parentPage()}; }
  if($("#fm")){ wireForm(app); }
  if($("#addk")) $("#addk").onclick=()=>{ if($("#fm")) draft=readForm(app); adding=true; parentPage(); setTimeout(()=>$("#nid")&&$("#nid").scrollIntoView({behavior:"smooth",block:"center"}),50); };
  if($("#sv")) $("#sv").onclick=()=>{ const p=readForm(app); draft=p; if(!validateForm(app,p)) return $("#m").innerHTML='<div class="alert err">يرجى تصحيح الحقول المظلّلة بالأحمر</div>'; confirmSave(p); };
}
async function addKid(){
  const nid=digits($("#nid").value,10), dob=$("#dob").value; let ok=true;
  $("#e1").textContent=isNid(nid)?"":(ok=false,"الرقم الوطني يجب أن يتكون من 10 أرقام");
  $("#e2").textContent=dob?"":(ok=false,"أدخل تاريخ الميلاد");
  if(!ok) return;
  if(kids.some(k=>k.nid===nid)) return $("#lm").innerHTML='<div class="alert warn">هذا الطالب مضاف مسبقاً.</div>';
  $("#add").disabled=true; $("#add").textContent="جارٍ التحقق…";
  try{
    const r=await rpc("parent_lookup",{p_nid:nid,p_dob:dob});
    if(r.error){ $("#add").disabled=false; $("#add").textContent=kids.length?"إضافة الطالب":"بحث"; return $("#lm").innerHTML=`<div class="alert err">${ERR[r.error]||"خطأ"}</div>`; }
    kids.push({nid,dob,name:r.name,birth_place:r.birth_place,grade:r.grade,section:r.section,nationality:r.nationality,status:r.data?r.data.status:"none",data:r.data,closed:r.closed});
    if(!draft&&r.data&&r.data.status!=="submitted") draft=r.data;
    adding=false; parentPage();
  }catch(e){ $("#add").disabled=false; $("#add").textContent=kids.length?"إضافة الطالب":"بحث"; $("#lm").innerHTML=`<div class="alert err">${esc(e.message)}</div>`; }
}
const RELS=["أب","أم","أخ","أخت","عم","عمة","خال","خالة","جد","جدة","أخرى"];
function relField(id,label,v){
  const known=RELS.includes(v), val=v||"";
  return `<div class="field"><label>${label}</label><select class="inp" id="${id}">
   <option value="">اختر…</option>${RELS.map(r=>`<option ${(known&&r===val)||(!known&&val&&r==="أخرى")?"selected":""}>${r}</option>`).join("")}</select>
   <input class="inp ${(!known&&val)?"":"hide"}" id="${id}_o" placeholder="اكتب صلة القرابة" value="${(!known&&val)?esc(val):""}" style="margin-top:8px"><div class="errt" id="e_${id}"></div></div>`;
}
function phoneField(id,label,v,ag){
  return `<div class="field"><label>${label}</label><input class="inp" id="${id}" inputmode="numeric" dir="ltr" maxlength="10" placeholder="07XXXXXXXX" value="${esc(v||"")}">
   <div class="hint">رقم أردني يبدأ بـ 07 ويتكون من 10 أرقام</div><div class="errt" id="e_${id}"></div>
   <label class="chk"><input type="checkbox" id="${id}_ag" ${ag?"checked":""}><span>استخدام هذا الرقم لاستقبال رسالة كود دخول الطالب على منصة أجيال</span></label></div>`;
}
function nameField(id,label,v){ return `<div class="field"><label>${label}</label><input class="inp" id="${id}" value="${esc(v||"")}" placeholder="الاسم الثلاثي على الأقل"><div class="errt" id="e_${id}"></div></div>`; }
function formBody(d){ d=d||{}; return `
 <div class="sec-t" style="margin-top:6px"><i>👤</i>ولي الأمر</div>
 ${nameField("gn","اسم ولي الأمر",d.guardian_name)}
 <div class="grid2">${relField("gr","صلة القرابة",d.guardian_relation)}
  <div class="field"><label>مهنة ولي الأمر</label><input class="inp" id="go" value="${esc(d.guardian_occupation||"")}" placeholder="موظف، معلم، أعمال حرة، متقاعد…"><div class="errt" id="e_go"></div></div></div>
 ${phoneField("gp","رقم هاتف ولي الأمر",d.guardian_phone,d.guardian_phone_agyal)}
 <div class="sec-t"><i>🏫</i>شخص آخر لمتابعة الطالب في المدرسة</div>
 ${nameField("sn","الاسم",d.school_contact_name)}
 <div class="grid2">${relField("sr","صلة القرابة",d.school_contact_relation)}${phoneField("sp","رقم الهاتف",d.school_contact_phone,d.school_contact_agyal)}</div>`; }
function wireForm(root){
  ["gp","sp"].forEach(id=>{const e=root.querySelector("#"+id); e.oninput=()=>{e.value=digits(e.value,10)}});
  ["gr","sr"].forEach(id=>{const s=root.querySelector("#"+id); s.onchange=()=>root.querySelector("#"+id+"_o").classList.toggle("hide",s.value!=="أخرى")});
}
function readForm(root){
  const rel=id=>{const v=root.querySelector("#"+id).value; return v==="أخرى"?root.querySelector("#"+id+"_o").value.trim():v;};
  return {guardian_name:root.querySelector("#gn").value.trim(),guardian_relation:rel("gr"),guardian_occupation:root.querySelector("#go").value.trim(),guardian_phone:digits(root.querySelector("#gp").value,10),guardian_phone_agyal:root.querySelector("#gp_ag").checked,
    school_contact_name:root.querySelector("#sn").value.trim(),school_contact_relation:rel("sr"),school_contact_phone:digits(root.querySelector("#sp").value,10),school_contact_agyal:root.querySelector("#sp_ag").checked};
}
function validateForm(root,p){
  const set=(id,m)=>{const e=root.querySelector("#e_"+id); if(e)e.textContent=m||""; const i=root.querySelector("#"+id); if(i)i.classList.toggle("bad",!!m)};
  let ok=true; const chk=(id,c,m)=>{set(id,c?"":m); if(!c)ok=false};
  const full=s=>s.split(/\s+/).filter(Boolean).length>=2&&s.length>=5;
  chk("gn",full(p.guardian_name),"أدخل الاسم الكامل (كلمتان على الأقل)");
  chk("gr",p.guardian_relation.length>=2,"اختر صلة القرابة");
  chk("go",p.guardian_occupation.length>=2,"أدخل مهنة ولي الأمر");
  chk("gp",isPhone(p.guardian_phone),"الرقم يجب أن يبدأ بـ 07 ويتكون من 10 أرقام");
  chk("sn",full(p.school_contact_name),"أدخل الاسم الكامل (كلمتان على الأقل)");
  chk("sr",p.school_contact_relation.length>=2,"اختر صلة القرابة");
  chk("sp",isPhone(p.school_contact_phone),"الرقم يجب أن يبدأ بـ 07 ويتكون من 10 أرقام");
  return ok;
}
function confirmSave(p){
  const el=eligible();
  const w=modal(`<h2>تأكيد حفظ البيانات</h2>
   <div class="sub">سيتم حفظ بيانات التواصل لـ ${el.length>1?"الطلبة":"الطالب"}:</div>
   ${el.map(k=>`<div class="kid"><div class="av">${esc(initials(k.name))}</div><div><div class="nm">${esc(k.name)}</div><div class="mt">${esc([k.grade,k.section&&("شعبة "+k.section)].filter(Boolean).join(" · "))}</div></div></div>`).join("")}
   <div class="pledge"><b>تعهّد والتزام</b><br>${esc(SET.consent_text||"أتعهد بأنني المسؤول عن صحة جميع البيانات المدخلة، وأوافق على اعتمادها في سجلات المدرسة واستخدامها لأغراض العملية التعليمية والتواصل الرسمي.")}</div>
   <label class="chk consent"><input type="checkbox" id="pc"><span>أقرّ بأنني اطلعت على البيانات وأتعهد بصحتها وأتحمل المسؤولية عنها.</span></label>
   <div id="pm"></div><div class="actions"><button class="btn" id="py" disabled>✔ تأكيد الحفظ</button><button class="btn sec" id="pn">رجوع للتعديل</button></div>`);
  w.querySelector("#pc").onchange=e=>{w.querySelector("#py").disabled=!e.target.checked};
  w.querySelector("#pn").onclick=()=>w.remove();
  w.querySelector("#py").onclick=async()=>{
    const b=w.querySelector("#py"); b.disabled=true; b.textContent="جارٍ الحفظ…"; w.querySelector("#pm").innerHTML="";
    const body={...p,consent:true}, fails=[];
    for(const k of el){
      try{ const r=await rpc("parent_submit",{p_nid:k.nid,p_dob:k.dob,p:body}); if(r.error) fails.push(`${k.name}: ${ERR[r.error]||r.error}`); else { k.status="submitted"; k.data={...body,status:"submitted"}; } }
      catch(e){ fails.push(`${k.name}: ${e.message}`); } }
    if(fails.length){ b.disabled=false; b.textContent="✔ تأكيد الحفظ"; w.querySelector("#pm").innerHTML=`<div class="alert err">${fails.map(esc).join("<br>")}</div>`; }
    else { w.remove(); parentDone(); }
  };
}
function parentDone(){
  draft=null;
  app.innerHTML=`<div class="wrap" style="padding-top:18px"><div class="card success"><div class="big">✓</div><h2>تم حفظ البيانات بنجاح</h2>
  <div class="sub">شكراً لتعاونكم. تم تحديث بيانات:</div>
  <div style="text-align:start">${kids.filter(k=>k.status==="submitted").map(k=>`<div class="kid"><div class="av">${esc(initials(k.name))}</div><div class="nm">${esc(k.name)}</div><div class="x"><span class="pill p-ok">تم</span></div></div>`).join("")}</div>
  <div class="actions" style="justify-content:center"><button class="btn" id="add2">＋ إضافة طالب آخر</button><button class="btn sec" id="fin">إنهاء</button></div></div></div>`;
  $("#add2").onclick=()=>{adding=true;parentPage()}; $("#fin").onclick=()=>{kids=[];draft=null;adding=false;go()};
}

  chrome("دخول الإدارة والمرشد",{home:true});
  app.innerHTML=`<div class="wrap" style="max-width:460px"><div class="card" style="margin-top:28px"><h2>تسجيل الدخول</h2><div class="sub">للإدارة والمرشد التربوي فقط</div>
   <div class="field"><label>اسم المستخدم</label><input class="inp" id="u" dir="ltr" autocomplete="username" autocapitalize="none"></div>
   <div class="field"><label>كلمة المرور</label><input class="inp" id="pw" type="password" dir="ltr" autocomplete="current-password"></div>
   <div id="m"></div><div class="actions"><button class="btn block" id="go">دخول</button></div></div></div>`;
  const run=async()=>{ $("#go").disabled=true;
    try{ const r=await rpc("staff_login",{p_user:$("#u").value,p_pass:$("#pw").value});
      if(r.error){ $("#m").innerHTML=`<div class="alert err">${ERR[r.error]}</div>`; $("#go").disabled=false; }

let ALL=[], TAB="overview", F={q:"",status:"",grade:"",section:"",nat:"",ag:""}, LIM=100;
const isAdmin=()=>staff&&staff.role==="admin";
const stOf=x=>!x.g?"no":(x.g.status==="reopened"?"re":"ok");
const STL={ok:"محدَّث",no:"لم يحدّث",re:"أُعيد فتحه"};

async function staffApp(){
  chrome((isAdmin()?"لوحة المطوّر · ":"لوحة المرشد · ")+staff.name,{out:true});
  app.innerHTML='<div class="empty">جارٍ تحميل البيانات…</div>';
  try{ ALL=await rpc("staff_list",{p_token:staff.token}); }catch(e){ return; }
  renderShell();
}
function renderShell(){
  const tabs=[["overview","📊","نظرة عامة"],["students","🎓","الطلبة"]];
  if(isAdmin()) tabs.push(["settings","⚙️","الإعدادات"],["users","👥","المستخدمون"],["audit","🧾","السجل"]);
  app.innerHTML=`<div class="shell"><nav class="side">${tabs.map(t=>`<button class="nav ${TAB===t[0]?"on":""}" data-t="${t[0]}"><span class="e">${t[1]}</span><span>${t[2]}</span></button>`).join("")}
   <button class="nav" id="pwb"><span class="e">🔑</span><span>كلمتي</span></button></nav><section class="main" id="main"></section></div>`;
  $$("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;renderShell()}); $("#pwb").onclick=changePw;
  ({overview,students,settings,users,audit})[TAB]();
}
function group(list,fn){ const m=new Map(); list.forEach(x=>{const k=fn(x)||"غير محدد"; const o=m.get(k)||{k,t:0,d:0}; o.t++; if(x.g&&x.g.status==="submitted")o.d++; m.set(k,o)}); return [...m.values()].sort((a,b)=>b.t-a.t); }
function hbars(rows){ return rows.map(r=>{const p=r.t?Math.round(r.d*100/r.t):0; return `<div class="hb"><div class="t"><span>${esc(r.k)}</span><span>${r.d} / ${r.t} · ${p}%</span></div><div class="tr"><i style="width:${p}%"></i></div></div>`}).join("")||'<div class="empty">لا بيانات</div>'; }

function overview(){
  const tot=ALL.length, done=ALL.filter(x=>stOf(x)==="ok").length, re=ALL.filter(x=>stOf(x)==="re").length, no=tot-done-re;
  const pct=tot?Math.round(done*100/tot):0, ag=ALL.filter(x=>x.g&&(x.g.guardian_phone_agyal||x.g.school_contact_agyal)).length;
  const C=2*Math.PI*52, dd=C*done/(tot||1), rr=C*re/(tot||1);
  const days=[]; for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10); days.push({d,n:0})}
  ALL.forEach(x=>{ if(x.g&&x.g.status==="submitted"){const d=(x.g.updated_at||"").slice(0,10); const o=days.find(a=>a.d===d); if(o)o.n++;} });
  const mx=Math.max(1,...days.map(d=>d.n));
  $("#main").innerHTML=`<h1>نظرة عامة</h1><div class="lead">متابعة تحديث بيانات أولياء الأمور لحظة بلحظة</div>
  <div class="kpis"><div class="kpi"><div class="l">إجمالي الطلبة</div><div class="v">${tot}</div></div>
   <div class="kpi"><div class="l">تم التحديث</div><div class="v" style="color:var(--ok)">${done}</div><div class="d">${pct}% من الطلبة</div></div>
   <div class="kpi"><div class="l">لم يحدّثوا بعد</div><div class="v" style="color:var(--bad)">${no}</div></div>
   <div class="kpi"><div class="l">طلبوا كود أجيال برسالة</div><div class="v">${ag}</div>${re?`<div class="d">${re} أُعيد فتحها</div>`:""}</div></div>
  <div class="cols"><div class="card"><h2>نسبة الإنجاز</h2><div class="donut">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface2)" stroke-width="14"/>
     <circle cx="60" cy="60" r="52" fill="none" stroke="var(--ok)" stroke-width="14" stroke-dasharray="${dd} ${C}" transform="rotate(-90 60 60)" stroke-linecap="round"/>
     <circle cx="60" cy="60" r="52" fill="none" stroke="var(--warn)" stroke-width="14" stroke-dasharray="${rr} ${C}" stroke-dashoffset="${-dd}" transform="rotate(-90 60 60)"/>
     <text x="60" y="68" text-anchor="middle" font-size="24" font-weight="800" fill="currentColor">${pct}%</text></svg>
    <div class="lg"><div><i style="background:var(--ok)"></i>محدَّث: ${done}</div><div><i style="background:var(--warn)"></i>أُعيد فتحه: ${re}</div><div><i style="background:var(--surface2);border:1px solid var(--line)"></i>لم يحدّث: ${no}</div></div></div></div>
   <div class="card"><h2>التحديثات خلال 14 يوماً</h2><div class="spark" style="margin-top:22px">${days.map(d=>`<div style="height:${Math.max(3,d.n*100/mx)}%">${d.n?`<span>${d.n}</span>`:""}</div>`).join("")}</div>
    <div class="axis">${days.map(d=>`<span>${d.d.slice(8)}</span>`).join("")}</div></div></div>
  <div class="cols"><div class="card"><h2>حسب الصف</h2>${hbars(group(ALL,x=>x.grade))}</div>
   <div class="card"><h2>حسب الجنسية</h2>${hbars(group(ALL,x=>x.nationality))}</div></div>`;
}

function uniq(k){ return [...new Set(ALL.map(x=>x[k]).filter(Boolean))].sort(); }
function filtered(){
  const q=toEn(F.q).toLowerCase();
  return ALL.filter(x=>(!F.status||stOf(x)===F.status)&&(!F.grade||x.grade===F.grade)&&(!F.section||x.section===F.section)&&(!F.nat||x.nationality===F.nat)
    &&(!F.ag||(F.ag==="y"?(x.g&&(x.g.guardian_phone_agyal||x.g.school_contact_agyal)):!(x.g&&(x.g.guardian_phone_agyal||x.g.school_contact_agyal))))
    &&(!q||x.full_name.toLowerCase().includes(q)||x.national_id.includes(q)||(x.g&&(x.g.guardian_phone.includes(q)||x.g.school_contact_phone.includes(q)||x.g.guardian_name.toLowerCase().includes(q)))));
}
const opts=(arr,cur,ph)=>`<option value="">${ph}</option>`+arr.map(v=>`<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("");
function students(){
  $("#main").innerHTML=`<h1>الطلبة</h1><div class="lead">بحث وفلترة وتعديل وتصدير</div>
  <div class="filters"><input class="inp q" id="fq" type="search" placeholder="🔍 بحث بالاسم أو الرقم الوطني أو الهاتف" value="${esc(F.q)}">
   <select class="inp" id="fs"><option value="">كل الحالات</option>${Object.entries(STL).map(([k,v])=>`<option value="${k}" ${F.status===k?"selected":""}>${v}</option>`).join("")}</select>
   <select class="inp" id="fg">${opts(uniq("grade"),F.grade,"كل الصفوف")}</select>
   <select class="inp" id="fsec">${opts(uniq("section"),F.section,"كل الشعب")}</select>
   <select class="inp" id="fn">${opts(uniq("nationality"),F.nat,"كل الجنسيات")}</select>

function fixDate(v){
  if(v instanceof Date) return new Date(v.getTime()+12*36e5).toISOString().slice(0,10);
  if(typeof v==="number"){ const o=XLSX.SSF.parse_date_code(v); return o?`${o.y}-${String(o.m).padStart(2,"0")}-${String(o.d).padStart(2,"0")}`:""; }
  v=toEn(v); let m=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=v.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; return ""; }

   <div class="field"><label>نص التعهد</label><textarea class="inp" id="sc" rows="3">${esc(SET.consent_text)}</textarea></div>
   <div id="mm"></div><div class="actions"><button class="btn" id="sv">حفظ الإعدادات</button></div></div>`;
  $("#sv").onclick=async()=>{ try{ await rpc("staff_settings_save",{p_token:staff.token,p:{form_open:$("#so").checked,deadline:$("#sd").value,school_name:$("#sn").value,announcement:$("#sa").value,consent_text:$("#sc").value}});
    SET=await rpc("get_public_settings"); applySettings(); toast("تم حفظ الإعدادات"); }catch(e){ $("#mm").innerHTML=`<div class="alert err">${esc(e.message)}</div>`; } };
}
async function users(){
  $("#main").innerHTML=`<h1>المستخدمون</h1><div class="lead">حسابات الإدارة والمرشد</div><div id="ul" class="empty">جارٍ التحميل…</div>`;
  let U; try{ U=await rpc("staff_users_list",{p_token:staff.token}); }catch(e){ return; }
  $("#ul").className=""; $("#ul").innerHTML=`<div class="card">${U.map(u=>`<div class="kid"><div class="av">${esc(initials(u.display_name))}</div><div><div class="nm">${esc(u.display_name)}</div><div class="mt" dir="ltr" style="text-align:right">${esc(u.username)} · ${u.role==="admin"?"مطوّر/أدمن":"مرشد تربوي"}</div></div>
    <div class="x"><button class="btn sm sec" data-u="${u.id}">تعديل / تغيير كلمة المرور</button></div></div>`).join("")}
    <div class="actions"><button class="btn" id="nu">+ مستخدم جديد</button></div></div>`;
  const edit=u=>{ const w=modal(`<h2>${u?"تعديل مستخدم":"مستخدم جديد"}</h2>
    <div class="field"><label>اسم المستخدم (إنجليزي)</label><input class="inp" id="b1" dir="ltr" value="${esc(u?.username||"")}" ${u?"disabled":""}></div>
    <div class="field"><label>الاسم الظاهر</label><input class="inp" id="b2" value="${esc(u?.display_name||"")}"></div>
    <div class="field"><label>الصلاحية</label><select class="inp" id="b3"><option value="counselor" ${u?.role==="counselor"?"selected":""}>مرشد تربوي</option><option value="admin" ${u?.role==="admin"?"selected":""}>مطوّر / أدمن</option></select></div>
    <div class="field"><label>كلمة المرور ${u?"(اتركها فارغة لعدم التغيير)":"(8 أحرف على الأقل)"}</label><input class="inp" id="b4" type="password" dir="ltr" autocomplete="new-password"></div>
    <div id="mm"></div><div class="actions"><button class="btn" id="sv">حفظ</button><button class="btn sec" id="cc">إلغاء</button></div>`);
    w.querySelector("#cc").onclick=()=>w.remove();
    w.querySelector("#sv").onclick=async()=>{ try{ const r=await rpc("staff_user_save",{p_token:staff.token,p_username:w.querySelector("#b1").value,p_display:w.querySelector("#b2").value,p_role:w.querySelector("#b3").value,p_pass:w.querySelector("#b4").value});
      if(r.error) w.querySelector("#mm").innerHTML=`<div class="alert err">${ERR[r.error]||"تحقق من الحقول"}</div>`; else { w.remove(); toast("تم الحفظ"); users(); } }catch(e){ w.querySelector("#mm").innerHTML=`<div class="alert err">${esc(e.message)}</div>`; } }; };
  $("#nu").onclick=()=>edit(null); $$("[data-u]").forEach(b=>b.onclick=()=>edit(U.find(u=>u.id==b.dataset.u)));
}
const ACT={submit:"إرسال من ولي الأمر",edit:"تعديل بيانات تواصل",reopen:"إعادة فتح",clear:"مسح بيانات",import:"استيراد طلبة",student_save:"حفظ طالب",student_delete:"حذف طالب",settings:"تعديل الإعدادات",user_save:"حفظ مستخدم"};
async function audit(){
  $("#main").innerHTML=`<h1>سجل النشاط</h1><div class="lead">آخر 200 عملية</div><div class="empty">جارٍ التحميل…</div>`;
  let A; try{ A=await rpc("staff_audit",{p_token:staff.token}); }catch(e){ return; }
  const nm=n=>{const s=ALL.find(x=>x.national_id===n); return s?s.full_name:n||""};
  $("#main").innerHTML=`<h1>سجل النشاط</h1><div class="lead">آخر 200 عملية</div><div class="tw"><table><thead><tr><th>الوقت</th><th>المنفّذ</th><th>العملية</th><th>الطالب / ملاحظة</th></tr></thead><tbody>
   ${A.map(a=>`<tr><td class="s" dir="ltr" style="text-align:right">${esc((a.at||"").slice(0,16).replace("T"," "))}</td><td>${a.actor==="parent"?"ولي أمر":esc(a.actor)}</td><td>${esc(ACT[a.action]||a.action)}</td><td>${esc(nm(a.national_id)||a.note||"")}</td></tr>`).join("")||'<tr><td colspan="4"><div class="empty">لا يوجد نشاط</div></td></tr>'}</tbody></table></div>`;
}
function changePw(){
  const w=modal(`<h2>تغيير كلمة المرور</h2><div class="field"><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input class="inp" id="np" type="password" dir="ltr" autocomplete="new-password"></div><div id="mm"></div>
   <div class="actions"><button class="btn" id="s3">حفظ</button><button class="btn sec" id="c3">إلغاء</button></div>`);
  w.querySelector("#c3").onclick=()=>w.remove();
  w.querySelector("#s3").onclick=async()=>{ try{ const r=await rpc("staff_change_password",{p_token:staff.token,p_new:w.querySelector("#np").value});
    if(r.error) w.querySelector("#mm").innerHTML=`<div class="alert err">${ERR[r.error]}</div>`; else { w.remove(); toast("تم تغيير كلمة المرور"); } }catch(e){ w.querySelector("#mm").innerHTML=`<div class="alert err">${esc(e.message)}</div>`; } };
}
go();
</script>
